name: rebuild gallery.json

# Contributors only add files to profiles/; gallery.json (what KeyGlow downloads) is rebuilt here.
on:
  push:
    branches: [main]
    paths: ["profiles/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/HiddenOnLies/KeyGlow
      - run: keyglow gallery profiles --bundle gallery.json
      - name: Commit gallery.json if it changed
        run: |
          if git diff --quiet -- gallery.json; then echo "gallery.json is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git commit -m "Rebuild gallery.json"
          git push
