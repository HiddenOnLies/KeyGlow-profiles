name: rebuild gallery.json

# Contributors only add files to profiles/; gallery.json (what KeyGlow downloads) is rebuilt here.
on:
  push:
    branches: [main]
    paths: ["profiles/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/HiddenOnLies/KeyGlow
      - run: keyglow gallery profiles --bundle /tmp/gallery.json
      - name: Commit gallery.json if the profiles changed
        run: |
          # gallery.json also carries the date it was built; only a change in the profiles counts
          python - <<'PY'
          import json, shutil, sys
          built = json.load(open("/tmp/gallery.json"))
          committed = json.load(open("gallery.json"))
          if built["profiles"] == committed["profiles"]:
              print("gallery.json is up to date"); sys.exit(0)
          shutil.copy("/tmp/gallery.json", "gallery.json")
          PY
          if git diff --quiet -- gallery.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git commit -m "Rebuild gallery.json"
          git push
