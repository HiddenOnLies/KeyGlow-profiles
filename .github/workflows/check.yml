name: check profiles

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/HiddenOnLies/KeyGlow
      - name: Validate every profile
        run: keyglow gallery profiles --bundle /tmp/gallery.json
